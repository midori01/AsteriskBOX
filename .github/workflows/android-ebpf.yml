name: Build Android eBPF

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - goarch: arm64
            compiler: aarch64-linux-android35-clang
    env:
      BASE_TAGS: with_quic,with_ebpf,badlinkname,tfogo_checklinkname0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build with eBPF
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.compiler }}
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
        run: |
          export TAGS="$BASE_TAGS"
          make ebpf_generate
          make ebpf_check
          make build

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-${{ matrix.target.goarch }}-with-ebpf
          path: sing-box
