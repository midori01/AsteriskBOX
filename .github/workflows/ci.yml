name: CI Build

run-name: sing-box branch - ${{ github.event.inputs.core_branch || 'core-next' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      core_branch:
        description: "sing-box branch"
        required: true
        type: choice
        default: "core-next"
        options:
          - "core"
          - "core-next"
          - "core-stable"


permissions:
  contents: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sing-box:
    name: Build (${{ matrix.target.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - goarch: arm64
            compiler: aarch64-linux-android35-clang
    env:
      BASE_TAGS: with_quic,with_ebpf,badlinkname,tfogo_checklinkname0
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.core_branch || 'core-next' }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build with eBPF
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.compiler }}
          CGO_CFLAGS: "-O3 -DNDEBUG -fvisibility=hidden -ffunction-sections -fdata-sections"
        run: |
          tags="${BASE_TAGS}"
          export TAGS="${tags}"
          make build
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -s sing-box || llvm-strip -s sing-box || strip -s sing-box
          xz -9e sing-box

      - name: Upload sing-box binary
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-arm64
          path: sing-box.xz

  compile:
    name: Build MidoriBOX APK
    needs: build-sing-box
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download sing-box binary
        uses: actions/download-artifact@v8
        with:
          name: sing-box-arm64
          path: sing-box

      - name: Prepare sing-box binary
        run: |
          chmod +r sing-box/sing-box.xz || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          licenses_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$licenses_status" -ne 0 ]; then
            echo "::error::Failed to accept Android SDK licenses."
            exit "$licenses_status"
          fi

          target_sdk="$(sed -n 's/^[[:space:]]*const val TARGET_SDK = \([0-9]\+\).*/\1/p' buildSrc/src/main/kotlin/BuildConfig.kt | head -n 1)"
          if [ -z "$target_sdk" ]; then
            echo "::error::Unable to read ProjectConfig.TARGET_SDK from buildSrc/src/main/kotlin/BuildConfig.kt."
            exit 1
          fi

          available_packages="$(sdkmanager --list | awk '{ print $1 }')"
          platform_package="platforms;android-${target_sdk}"
          if ! grep -Fxq "$platform_package" <<< "$available_packages"; then
            if grep -Fxq "platforms;android-${target_sdk}.0" <<< "$available_packages"; then
              platform_package="platforms;android-${target_sdk}.0"
            else
              echo "::error::No Android SDK platform package is available for TARGET_SDK=$target_sdk."
              exit 1
            fi
          fi

          build_tools_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^build-tools;[0-9]/ { print $1 }' | sort -V | tail -n 1)"
          ndk_package="$(printf '%s\n' "$available_packages" | awk '$1 ~ /^ndk;[0-9]/ { print $1 }' | sort -V | tail -n 1)"

          if [ -z "$build_tools_package" ]; then
            echo "::error::No Android build-tools package is available from sdkmanager."
            exit 1
          fi
          if [ -z "$ndk_package" ]; then
            echo "::error::No Android NDK package is available from sdkmanager."
            exit 1
          fi

          sdkmanager --install "$platform_package" "$build_tools_package" "$ndk_package"

          ndk_version="${ndk_package#ndk;}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Assemble APK
        run: ./gradlew --no-daemon :app:assembleRelease -Pandroid.splits.abi.include=arm64-v8a -Psingbox.local=${{ github.workspace }}/sing-box/sing-box.xz

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          APK="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk"
          zipalign=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          apksigner=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          "$zipalign" -p -f 4 "$APK" "${APK}.aligned"
          "$apksigner" sign \
            --ks release.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$SIGNED" \
            "${APK}.aligned"
          "$apksigner" verify "$SIGNED"
          mv "$SIGNED" "$APK"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          RENAMED="app/build/outputs/apk/release/MidoriBOX-${VERSION_CODE}-arm64-v8a-release.apk"
          mv "$APK" "$RENAMED"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MidoriBOX-${{ env.VERSION_CODE }}
          path: app/build/outputs/apk/release/MidoriBOX-${{ env.VERSION_CODE }}-arm64-v8a-release.apk
          if-no-files-found: error
          archive: false

      - name: Publish CI Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file="app/build/outputs/apk/release/MidoriBOX-${VERSION_CODE}-arm64-v8a-release.apk"
          commit_subject="$(git log -1 --pretty=%s)"
          release_notes="CI Build (${VERSION_CODE}): ${commit_subject} (${GITHUB_SHA::7})"

          if gh release view ci-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view ci-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [[ -n "$asset" && "$asset" == *.apk ]]; then
                echo "Removing previous release asset: $asset"
                gh release delete-asset ci-latest "$asset" --repo "$GITHUB_REPOSITORY" -y || true
              fi
            done
            gh release upload ci-latest "$apk_file" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit ci-latest \
              --target "$GITHUB_SHA" \
              --title "MidoriBOX (${VERSION_CODE})" \
              --notes "$release_notes"
          else
            gh release create ci-latest "$apk_file" \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MidoriBOX (${VERSION_CODE})" \
              --notes "$release_notes" \
              --prerelease
          fi
